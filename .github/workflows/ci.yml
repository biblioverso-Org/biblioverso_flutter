name: Flutter CI

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Instalación de Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 3️⃣ Ver versión de Flutter
      - name: Flutter version
        run: flutter --version

      # 4️⃣ Instalar dependencias
      - name: Install dependencies
        run: flutter pub get

      # 7️⃣ Test unitarios
      - name: Execute Unit, Integration, and E2E Tests
        run: flutter test --coverage

      # 9️⃣ Compilar APK (solo para validar build)
      - name: Build APK
        run: flutter build apk